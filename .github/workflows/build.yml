name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Schriften laden
        run: bash tools/fetch-fonts.sh

      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: omniscient-madame-cat-debug
          path: app/build/outputs/apk/debug/*.apk

      # Fester Link fürs Handy, direkt zur APK statt zu einem ZIP:
      # https://github.com/<besitzer>/<repo>/releases/download/neuester-build/omniscient-madame-cat.apk
      - name: APK als Release "neuester-build" veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk omniscient-madame-cat.apk
          gh release delete neuester-build --cleanup-tag --yes || true
          gh release create neuester-build omniscient-madame-cat.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Neuester Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Zum Testen auf dem Handy: APK herunterladen und öffnen."

      # Zeichnet die Katze in jedem Zustand als Bild (Robolectric, ohne Handy).
      - name: Screenshots erzeugen
        run: gradle testDebugUnitTest --stacktrace

      # Bilder auf den Branch "screenshots", damit man sie im Repo ansehen kann.
      - name: Screenshots auf Branch "screenshots" ablegen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots
          cp app/build/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Screenshots für ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
